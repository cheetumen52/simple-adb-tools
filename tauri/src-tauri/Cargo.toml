[package]
name = "simple-adb-tools"
version = "1.3.0"
license = "GPL-3.0-or-later"
description = "Simple ADB tools – instalace APK a každodenní práce s adb"
authors = ["Hejzlar Development"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows (cargo#8519).
name = "simple_adb_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "net", "sync", "fs", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"

# Thin LTO + parallel codegen links far faster than fat LTO with one unit, for a slightly larger binary.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
