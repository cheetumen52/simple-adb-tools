name: Build & release (Tauri)

# Tag push (v1.2.3) builds installers and attaches them to a draft GitHub release.
# Manual run builds the same installers and keeps them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: tauri
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Simple ADB tools ${{ github.ref_name }}
          releaseBody: |
            Instalace APK, logcat, zrcadlení obrazovky, Wi‑Fi ladění a další adb nástroje bez terminálu.

            **Windows:** `*-setup.exe` (doporučeno) nebo `.msi`. Bez placeného certifikátu ukáže SmartScreen varování → Další informace → Přesto spustit.
            **macOS:** `.dmg` (Apple Silicon i Intel). Appka není notarizovaná → po prvním spuštění Nastavení → Soukromí a zabezpečení → Přesto otevřít.
          releaseDraft: true
          prerelease: false

      - name: Upload installers as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: simple-adb-tools-${{ matrix.platform }}
          path: |
            tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            tauri/src-tauri/target/**/release/bundle/msi/*.msi
            tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
