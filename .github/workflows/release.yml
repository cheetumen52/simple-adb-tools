name: Build & release (Tauri)

# Tag push (v1.2.3) builds installers and attaches them to a draft GitHub release.
# Manual run builds the same installers and keeps them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon and Intel build in parallel instead of one sequential universal build.
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
          key: ${{ matrix.rust-targets || 'native' }}

      - name: Install frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="v$(node -p "require('./tauri/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          py="$(command -v python3 || command -v python)"
          {
            echo "body<<NOTES_EOF"
            "$py" scripts/release-notes.py "$version"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # latest.json is assembled once by the updater-manifest job; parallel jobs would race on it.
          includeUpdaterJson: false
          projectPath: tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Simple ADB tools ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---
            Instalace APK, logcat, zrcadlení obrazovky, Wi‑Fi ladění a další adb nástroje bez terminálu. Nainstalovaná aplikace se příště aktualizuje sama.

            **Windows:** `*-setup.exe` (doporučeno) nebo `.msi`. Bez placeného certifikátu ukáže SmartScreen varování → Další informace → Přesto spustit.
            **macOS:** `_aarch64.dmg` pro Apple Silicon (M1 a novější), `_x64.dmg` pro Intel. Appka není notarizovaná → po prvním spuštění Nastavení → Soukromí a zabezpečení → Přesto otevřít.
          releaseDraft: true
          prerelease: false

      - name: Upload installers as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: simple-adb-tools-${{ matrix.platform }}-${{ matrix.rust-targets || 'x64' }}
          path: |
            tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            tauri/src-tauri/target/**/release/bundle/msi/*.msi
            tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/**/release/bundle/**/*.sig
            tauri/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  updater-manifest:
    # Builds latest.json for the in-app updater from the signatures every platform uploaded.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir sigs
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --dir sigs
          python3 - <<'PY'
          import json, os, datetime
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          targets = {
              "darwin-aarch64": lambda n: n.endswith("_aarch64.app.tar.gz.sig"),
              "darwin-x86_64": lambda n: n.endswith("_x64.app.tar.gz.sig"),
              "windows-x86_64": lambda n: n.endswith("-setup.exe.sig"),
          }
          platforms = {}
          for name in sorted(os.listdir("sigs")):
              for platform, match in targets.items():
                  if match(name):
                      platforms[platform] = {
                          "signature": open(os.path.join("sigs", name)).read().strip(),
                          "url": base + name[: -len(".sig")],
                      }
          missing = set(targets) - set(platforms)
          if missing:
              raise SystemExit(f"Missing updater signatures for: {sorted(missing)}")
          manifest = {
              "version": tag.lstrip("v"),
              "notes": os.popen(f"python3 scripts/release-notes.py {tag}").read().strip() or f"Simple ADB tools {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
