name: Build & release (Tauri)

# Installers are built only for a release: a push to main whose app version has no tag yet
# (i.e. a merged release PR) gets tagged and becomes a draft GitHub release to publish.
# Other pushes to main stop after the version check. A manual run builds workflow artifacts only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          tag="v$(node -p "require('./tauri/package.json').version")"
          release=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            release=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "### $tag: $([ "$release" = true ] && echo 'new version, building a release' || echo 'no release')" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  tag:
    # Tagging before the build means a re-run (or a later push) never builds the same version twice.
    needs: [version, ci]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Simple ADB tools ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

  build:
    needs: [version, ci, tag]
    # `always()` lets a manual run skip the tag job; the explicit results keep failures blocking.
    if: always() && needs.ci.result == 'success' && (needs.tag.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon and Intel build in parallel instead of one sequential universal build.
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
          key: ${{ matrix.rust-targets || 'native' }}

      - name: Install frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Release notes from CHANGELOG.md and CHANGELOG.en.md
        id: notes
        shell: bash
        run: |
          version="${{ needs.version.outputs.tag }}"
          py="$(command -v python3 || command -v python)"
          {
            echo "body<<NOTES_EOF"
            "$py" scripts/release-notes.py "$version"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # latest.json is assembled once by the updater-manifest job; parallel jobs would race on it.
          includeUpdaterJson: false
          projectPath: tauri
          args: ${{ matrix.args }}
          tagName: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.tag || '' }}
          releaseName: Simple ADB tools ${{ needs.version.outputs.tag }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---
            APK installs, logcat, screen mirroring, Wi‑Fi debugging and more adb tools without a terminal, in English and Czech. An installed app updates itself next time.

            **Windows:** `*-setup.exe` (recommended) or `.msi`. Without a paid certificate SmartScreen warns → More info → Run anyway.
            **macOS:** `_aarch64.dmg` for Apple Silicon (M1 and newer), `_x64.dmg` for Intel. The app is not notarized → after the first launch System Settings → Privacy & Security → Open Anyway.

            **Česky:** Windows `*-setup.exe` (SmartScreen → Další informace → Přesto spustit), macOS `_aarch64.dmg` pro Apple Silicon a `_x64.dmg` pro Intel (Nastavení → Soukromí a zabezpečení → Přesto otevřít).
          releaseDraft: true
          prerelease: false

      - name: Upload installers as artifacts
        if: needs.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: simple-adb-tools-${{ matrix.platform }}-${{ matrix.rust-targets || 'x64' }}
          path: |
            tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            tauri/src-tauri/target/**/release/bundle/msi/*.msi
            tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/**/release/bundle/**/*.sig
            tauri/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  updater-manifest:
    # Builds latest.json for the in-app updater from the signatures every platform uploaded.
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir sigs
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --dir sigs
          python3 - <<'PY'
          import json, os, datetime
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          targets = {
              "darwin-aarch64": lambda n: n.endswith("_aarch64.app.tar.gz.sig"),
              "darwin-x86_64": lambda n: n.endswith("_x64.app.tar.gz.sig"),
              "windows-x86_64": lambda n: n.endswith("-setup.exe.sig"),
          }
          platforms = {}
          for name in sorted(os.listdir("sigs")):
              for platform, match in targets.items():
                  if match(name):
                      platforms[platform] = {
                          "signature": open(os.path.join("sigs", name)).read().strip(),
                          "url": base + name[: -len(".sig")],
                      }
          missing = set(targets) - set(platforms)
          if missing:
              raise SystemExit(f"Missing updater signatures for: {sorted(missing)}")
          manifest = {
              "version": tag.lstrip("v"),
              "notes": os.popen(f"python3 scripts/release-notes.py {tag}").read().strip() or f"Simple ADB tools {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
