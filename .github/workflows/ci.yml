name: CI

# Every push and PR; the release workflow calls it first so nothing ships without green checks.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - name: Secret scan (repository)
        working-directory: .
        run: python3 scripts/check-secrets.py --self-test && python3 scripts/check-secrets.py --all
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Secret scan (bundled frontend)
        run: python3 ../scripts/check-secrets.py --path dist
      - name: CHANGELOG.md covers the app version
        working-directory: .
        run: python3 scripts/release-notes.py "v$(node -p "require('./tauri/package.json').version")" > /dev/null

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs fmt/clippy/tests cheaply; Windows covers the cfg(windows) code paths.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Placeholder frontend build
        shell: bash
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
