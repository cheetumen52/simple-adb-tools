name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect a phone over Wi‑Fi
        2. Drop an APK into the window
        3. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of *Settings → Copy diagnostics* (app version, OS, tool versions, devices).
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from the log panel (*Copy* in its header). Remove anything private.
      render: text
